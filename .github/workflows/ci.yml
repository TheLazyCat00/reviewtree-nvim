name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test Git review workflow
        run: bash tests/workflow.sh

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          version: stable
          neovim: true

      - name: Run Neovim regression tests
        env:
          REVIEWTREE_ROOT: ${{ github.workspace }}
        run: nvim --headless -u NONE -l tests/unit.lua

      - name: Smoke-test plugin load
        run: |
          nvim --headless -u NONE \
            --cmd "set runtimepath+=$PWD" \
            -c "runtime plugin/reviewtree.lua" \
            -c "lua require('reviewtree').setup()" \
            -c "lua assert(vim.fn.exists(':ReviewTree') == 2)" \
            -c qa
